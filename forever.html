<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nunca me apartaré de tu lado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
        }
        .message {
            font-size: 5em;
            color: white;
            font-weight: bold;
            text-align: center;
            animation: pulse 2s infinite;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        .music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
        }
        button {
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            background: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        #musicFrame {
            position: absolute;
            width: 0;
            height: 0;
            border: none;
        }
    </style>
</head>
<body>
    <div class="message">
        Nunca me apartaré de tu lado ❤️
    </div>

    <div class="music-control">
        <button onclick="toggleMusic()" id="musicBtn">
            🎵 Reproducir Música
        </button>
    </div>

    <iframe id="musicFrame" allow="autoplay; encrypted-media"></iframe>

    <script>
        let isPlaying = false;
        const musicBtn = document.getElementById("musicBtn");
        const iframe = document.getElementById("musicFrame");

        const videoId = "LjhCEhWiKXk";
        const musicURL = `https://www.youtube.com/embed/${videoId}?autoplay=1&loop=1&playlist=${videoId}&controls=0`;

        function toggleMusic() {
            if (isPlaying) {
                iframe.src = "";
                musicBtn.innerHTML = "🎵 Reproducir Música";
            } else {
                iframe.src = musicURL;
                musicBtn.innerHTML = "🎵 Pausar Música";
            }
            isPlaying = !isPlaying;
        }
    </script>
</body>
</html>
