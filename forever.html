<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'll never leave your side</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
        }
        .message {
            font-size: 5em;
            color: white;
            font-weight: bold;
            text-align: center;
            animation: pulse 2s infinite;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        .music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
        }
        button {
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            background: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="message">
       I'll never leave your side ❤️
    </div>

    <div class="music-control">
        <button onclick="toggleMusic()" id="musicBtn">
            🎵 Play Music
        </button>
    </div>

    <audio id="musica" loop>
        <source src="cancion.m4a" type="audio/mp4">
    </audio>

    <script>
        let isPlaying = false;
        const musicBtn = document.getElementById("musicBtn");
        const audio = document.getElementById("musica");

        function toggleMusic() {
            if (isPlaying) {
                audio.pause();
                musicBtn.innerHTML = "🎵 Play Music";
            } else {
                audio.play().catch(function(error) {
                    alert("Could not play the music. Make sure the file cancion.m4a is in the same folder.");
                });
                musicBtn.innerHTML = "🎵 Pause Music";
            }
            isPlaying = !isPlaying;
        }
    </script>
</body>
</html>
