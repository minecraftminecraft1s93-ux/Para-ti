<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Quieres ser mi novia?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        h1 {
            color: #333;
            font-size: 3.2em;
            margin-bottom: 25px;
        }
        .bears {
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            margin: 20px 0;
        }
        .buttons {
            margin-top: 35px;
        }
        button {
            padding: 18px 55px;
            font-size: 1.3em;
            margin: 0 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }
        .btn-red {
            background: #e74c3c;
            color: white;
        }
        .btn-green {
            background: #27ae60;
            color: white;
        }
    </style>
</head>
<body>
    <h1>¿Quieres ser mi novia?</h1>
    
    <img
        src="https://media.tenor.com/sSbr1al2-KQAAAAC/so-cute.gif"
        alt="Bears hugging"
        class="bears"
        width="480">
    
    <div class="buttons">
        <button class="btn-red" onclick="noFuncionas()">
            No quiero 💔
        </button>
        <button class="btn-green" onclick="window.location.href='forever.html'">
            Sí quiero 💕
        </button>
    </div>

    <script>
        function noFuncionas() {
            alert("😢 ¿Por qué no?... qué bueno que este botón no funciona 💕");
        }
    </script>
</body>
</html>
